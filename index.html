<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyzer Tech - Ferramentas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container"> 
    <h1>Ferramentas de Operações</h1>
    <div class="coluna">
      <h2>Extração de Dados Lyzer</h2>
      <div class="order-input-group" style="flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 20px;">
        <input type="email" id="lyzerEmail" placeholder="E-mail Lyzer" aria-label="E-mail Lyzer" class="order-input" />
        <input type="password" id="lyzerPassword" placeholder="Senha Lyzer" aria-label="Senha Lyzer" class="order-input" />
        <div>
          <input type="date" id="lyzerDate" aria-label="Data de Extração" class="order-input" style="width: 100%;" title="Data da Extração" />
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-primary btn-add" id="btnCrawler" onclick="rodarCrawler()" style="flex: 1;">Extrair Dados</button>
          <button class="btn-secondary" id="btnTop20Unidades" onclick="verTop20('unidades')" style="flex: 1;">Top 20 (Unidades)</button>
          <button class="btn-secondary" id="btnTop20Pesos" onclick="verTop20('pesos')" style="flex: 1;">Top 20 (Pesos)</button>
          <button class="btn-secondary" id="btnCorrigirJson" onclick="corrigirJson()" style="flex: 1;" title="Limpar quantidades e remover duplicados">Corrigir JSON</button>
        </div>
      </div>

      <!-- Painel de Status -->
      <div id="painelStatus" aria-live="polite" style="display: none; background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ddd;">
        <h3 style="margin-top: 0; color: #333; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px;">Status da Extração</h3>
        <div style="margin-bottom: 8px;">
            <strong>Estado:</strong> <span id="statusEstado" style="color: #007bff;">Iniciando...</span>
        </div>
        <div style="margin-bottom: 8px;">
            <strong>Progresso:</strong> <span id="statusProgresso">0 / 0 encomendas processadas</span>
        </div>
        <div id="statusErroContainer" style="display: none; margin-top: 10px; padding: 10px; background: #ffe6e6; border-left: 4px solid #dc3545; color: #a94442;">
            <strong>Erro:</strong> <span id="statusErroMensagem"></span>
        </div>
      </div>

      <h2>Geral</h2>
      <button class="btn-primary" onclick="window.open('dashboard.html', '_blank')" style="background-color: var(--secondary-color); margin-bottom: 15px;">Dashboard de Análise</button>
      <div class="order-input-group">
        <input type="text" id="numeroEncomendaGeral" placeholder="Nº da Encomenda" aria-label="Número da Encomenda" aria-describedby="erroEncomendaGeral" class="order-input" />
        <button class="btn-primary btn-add" onclick="pesquisarEncomenda()">Pesquisar</button>
      </div>
      <div id="erroEncomendaGeral" class="visually-hidden" aria-live="polite" style="color: #dc3545; font-size: 0.9rem; margin-top: -5px; margin-bottom: 10px;"></div>

      <button class="btn-primary" onclick="window.open('aviso_atraso.html', '_blank')">Avisar cliente sobre atraso</button>
      <button class="btn-primary" onclick="window.open('comunicacao_bot.html', '_blank')">Comunicação Com Bot</button>
      <button class="btn-primary" onclick="window.open('mapa_emel.html', '_blank')">Validar Mapa EMEL</button>
      <button class="btn-primary" onclick="abrirMensagemWhatsApp()">Report Bloqueio POS</button>
      <button class="btn-primary" onclick="abrirPaginaContato()">E-mail Artigo Esquecido</button>
      <div style="display: none;">
        <h2>Rato</h2>
        <button class="btn-primary" onclick="abrirLiveOperationsRato()">Rato - Em Direto</button>
        <button class="btn-primary" onclick="abrirRotaRato()">ROTA Rato</button>
      </div>  
      <h2>São Bento</h2>
      <button class="btn-primary" onclick="abrirLiveOperationsSaoBento()">São Bento - Em Direto</button>
      <button class="btn-primary" onclick="abrirRotaSaoBento()">ROTA São Bento</button>
    </div>
  </div>

  <!-- Modal Top 20 -->
  <div id="top20Modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tituloModalTop20" style="margin: 0; color: var(--primary-color);">Top 20 Produtos</h2>
        <div style="display: flex; gap: 10px;">
          <button class="btn-primary" id="btnExportarPdf" onclick="imprimirModal()" style="padding: 6px 12px; font-size: 0.9rem; width: auto;" title="Exportar lista para PDF via janela de impressão">PDF</button>
          <button class="btn-close" onclick="fecharModal()">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <ul id="listaTopProdutos" class="ranking-list"></ul>
      </div>
    </div>
  </div>

  <script>
    function fecharModal() {
      document.getElementById('top20Modal').classList.remove('active');
    }

    function imprimirModal() {
      // Dispara a janela de impressão nativa do navegador
      // O CSS `@media print` será responsável por ocultar o resto da página
      window.print();
    }

    function pesquisarEncomenda() {
      const input = document.getElementById('numeroEncomendaGeral');
      const erroElement = document.getElementById('erroEncomendaGeral');
      const searchText = input.value.trim();

      if (!searchText) {
        erroElement.textContent = 'Por favor, insira o número da encomenda.';
        erroElement.classList.remove('visually-hidden');
        input.setAttribute('aria-invalid', 'true');
        return;
      }

      erroElement.textContent = '';
      erroElement.classList.add('visually-hidden');
      input.setAttribute('aria-invalid', 'false');

      const url = new URL("https://perform.lyzer.tech/pt/app/retail/orders");
      url.searchParams.append("dateSearchFor", "deadline");
      url.searchParams.append("dateRange[from]", "2026-01-01T00:00:00.000Z");
      url.searchParams.append("dateRange[to]", new Date().toISOString());
      url.searchParams.append("searchText", searchText);
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      url.searchParams.append("sort", "deadline:desc");

      window.open(url.toString(), "_blank");
    }

    function abrirPaginaContato() {
      window.open("contact.html", "_blank");
    }

    function getStatusList() {
      return ["Pending","InAssignment","Open","Invoicing","Processing","Complete","InTransit","Incidence"];
    }

    function getFullStatusList() {
      return [...getStatusList(),"Cancelled","ManualAssignment"];
    }

    function abrirLiveOperationsSaoBento() {
      const agoraLocal = getLocalISOString(new Date());
      const agoraUTC = new Date().toISOString();
      const url = new URL("https://perform.lyzer.tech/pt/app/operations/live-operations");
      url.searchParams.append("dateRange[from]", agoraLocal);
      url.searchParams.append("stores", "244");

      const statuses = ["Cancelled", "Complete", "InAssignment", "Incidence", "InTransit", "Invoicing", "Open", "Pending", "Processing"];
      statuses.forEach(status => url.searchParams.append("status", status));

      url.searchParams.append("deadline", agoraUTC);
      url.searchParams.append("retailer", "29");
      url.searchParams.append("store", "244");
      url.searchParams.append("serviceType", "375");
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "50");

      window.open(url.toString(), "_blank");
    }

    function abrirLiveOperationsRato() {
      const agora = getLocalISOString(new Date());
      const url = new URL("https://perform.lyzer.tech/pt/app/operations/live-operations");
      url.searchParams.append("deliveryDeadline", agora);
      url.searchParams.append("retailer", "29");
      url.searchParams.append("store", "133");
      url.searchParams.append("serviceType", "190");
      getFullStatusList().forEach(status => url.searchParams.append("status", status));
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      window.open(url.toString(), "_blank");
    }

    function abrirMensagemWhatsApp() {
      window.open("mensagem.html", "_blank");
    }

    function getLocalISOString(date) {
      const offset = date.getTimezoneOffset();
      const dateWithOffset = new Date(date.getTime() - (offset * 60 * 1000));
      return dateWithOffset.toISOString().slice(0, -1);
    }

    function abrirRotaRato() {
      // Format current date as YYYY-MM-DDT00:00:00
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const dataAtual = `${yyyy}-${mm}-${dd}T00:00:00`;

      const url = new URL("https://perform.lyzer.tech/pt/app/operations/routes");
      url.searchParams.append("targetDate", dataAtual);
      url.searchParams.append("stores", "133");
      url.searchParams.append("storeServices", "190");
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      window.open(url.toString(), "_blank");
    }

    function abrirRotaSaoBento() {
      // Format current date as YYYY-MM-DDT00:00:00
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const dataAtual = `${yyyy}-${mm}-${dd}T00:00:00`;

      const url = new URL("https://perform.lyzer.tech/pt/app/operations/routes");
      url.searchParams.append("targetDate", dataAtual);
      url.searchParams.append("storeServices", "375");
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      window.open(url.toString(), "_blank");
    }

    let intervalId;

    function atualizarPainelStatus(status) {
      const painel = document.getElementById('painelStatus');
      const estado = document.getElementById('statusEstado');
      const progresso = document.getElementById('statusProgresso');
      const erroContainer = document.getElementById('statusErroContainer');
      const erroMensagem = document.getElementById('statusErroMensagem');

      painel.style.display = 'block';
      estado.textContent = status.estado;
      progresso.textContent = `${status.encomendasLidas} / ${status.totalEncomendas} encomendas processadas`;

      if (status.estado === 'Concluído') {
         estado.style.color = '#28a745';
      } else if (status.estado === 'Erros encontrados') {
         estado.style.color = '#dc3545';
      } else {
         estado.style.color = '#007bff';
      }

      if (status.erro) {
         erroContainer.style.display = 'block';
         erroMensagem.textContent = status.erro;
      } else {
         erroContainer.style.display = 'none';
      }
    }

    async function iniciarPollingStatus() {
       intervalId = setInterval(async () => {
          try {
             const res = await fetch('http://localhost:3000/api/crawler-status');
             if (res.ok) {
                const status = await res.json();
                atualizarPainelStatus(status);

                if (status.estado === 'Concluído' || status.estado === 'Erros encontrados' || status.estado === 'Inativo') {
                   clearInterval(intervalId);
                }
             }
          } catch(e) {
             console.error("Erro ao fazer polling do status", e);
             clearInterval(intervalId);
          }
       }, 1000);
    }

    async function rodarCrawler() {
      const email = document.getElementById('lyzerEmail').value.trim();
      const password = document.getElementById('lyzerPassword').value.trim();
      const targetDate = document.getElementById('lyzerDate').value;
      const btnCrawler = document.getElementById('btnCrawler');
      const painel = document.getElementById('painelStatus');
      const erroContainer = document.getElementById('statusErroContainer');
      const erroMensagem = document.getElementById('statusErroMensagem');

      if (!email || !password) {
        painel.style.display = 'block';
        erroContainer.style.display = 'block';
        erroMensagem.textContent = 'Por favor, preencha o e-mail e a senha.';
        document.getElementById('statusEstado').textContent = 'Erro';
        document.getElementById('statusEstado').style.color = '#dc3545';
        return;
      }

      btnCrawler.disabled = true;
      iniciarPollingStatus();

      try {
        const response = await fetch('http://localhost:3000/api/crawler', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password, targetDate })
        });

        const data = await response.json();

      } catch (error) {
         // O polling lidará com falhas que não retornam do servidor mas se a chamada falhar de imediato
         clearInterval(intervalId);
         atualizarPainelStatus({ estado: 'Erros encontrados', encomendasLidas: 0, totalEncomendas: 0, erro: 'Erro de conexão com o servidor local. O server.js está rodando?'});
      } finally {
        btnCrawler.disabled = false;
      }
    }

    async function corrigirJson() {
      const painel = document.getElementById('painelStatus');
      const estado = document.getElementById('statusEstado');
      const progresso = document.getElementById('statusProgresso');
      const erroContainer = document.getElementById('statusErroContainer');
      const btnCorrigirJson = document.getElementById('btnCorrigirJson');

      painel.style.display = 'block';
      estado.textContent = 'A corrigir JSON...';
      estado.style.color = '#007bff';
      progresso.textContent = '-';
      erroContainer.style.display = 'none';
      btnCorrigirJson.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/corrigir-json', {
          method: 'POST'
        });
        const data = await response.json();

        if (response.ok) {
          estado.textContent = data.message || 'JSON corrigido com sucesso!';
          estado.style.color = '#28a745';
        } else {
          estado.textContent = 'Erros encontrados';
          estado.style.color = '#dc3545';
          erroContainer.style.display = 'block';
          document.getElementById('statusErroMensagem').textContent = data.error || 'Falha ao corrigir JSON';
        }
      } catch (error) {
        estado.textContent = 'Erros encontrados';
        estado.style.color = '#dc3545';
        erroContainer.style.display = 'block';
        document.getElementById('statusErroMensagem').textContent = 'Erro de conexão com o servidor local. O server.js está rodando?';
      } finally {
        btnCorrigirJson.disabled = false;
      }
    }

    async function verTop20(tipo) {
      const painel = document.getElementById('painelStatus');
      const estado = document.getElementById('statusEstado');
      const erroContainer = document.getElementById('statusErroContainer');
      const progresso = document.getElementById('statusProgresso');

      const listaProdutos = document.getElementById('listaTopProdutos');
      const modal = document.getElementById('top20Modal');
      const tituloModal = document.getElementById('tituloModalTop20');

      const btnTop20Unidades = document.getElementById('btnTop20Unidades');
      const btnTop20Pesos = document.getElementById('btnTop20Pesos');

      painel.style.display = 'block';
      estado.textContent = 'Carregando ranking...';
      estado.style.color = '#007bff';
      progresso.textContent = '-';
      erroContainer.style.display = 'none';

      btnTop20Unidades.disabled = true;
      btnTop20Pesos.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/top-produtos');
        const data = await response.json();

        if (response.ok) {
          estado.textContent = 'Ranking carregado.';
          listaProdutos.innerHTML = '';

          let produtosLista = [];
          let unidadeTexto = '';

          if (tipo === 'pesos') {
             tituloModal.textContent = 'Top 20 Produtos (Pesos)';
             produtosLista = data.topPesos;
             unidadeTexto = ' kg';
          } else {
             tituloModal.textContent = 'Top 20 Produtos (Unidades)';
             produtosLista = data.topUnidades;
             unidadeTexto = ' unid.';
          }

          if (!produtosLista || produtosLista.length === 0) {
            listaProdutos.innerHTML = '<li style="text-align: center; color: #666;">Nenhum produto encontrado no histórico para esta categoria.</li>';
          } else {
            produtosLista.forEach((prod, index) => {
              const li = document.createElement('li');
              const posicao = index + 1;

              let rankClass = '';
              if (posicao === 1) rankClass = 'rank-1';
              else if (posicao === 2) rankClass = 'rank-2';
              else if (posicao === 3) rankClass = 'rank-3';
              else rankClass = 'rank-other';

              li.className = rankClass;
              // formata para duas casas decimais se não for numero inteiro
              const qtdFormatada = Number.isInteger(prod.quantidadeTotal) ? prod.quantidadeTotal : prod.quantidadeTotal.toFixed(2);
              li.innerHTML = `
                <span class="rank-position">${posicao}º</span>
                <span class="product-name">${prod.nome}</span>
                <span class="product-qty">${qtdFormatada}${unidadeTexto}</span>
              `;
              listaProdutos.appendChild(li);
            });
          }

          modal.classList.add('active');

        } else {
          estado.textContent = 'Erros encontrados';
          estado.style.color = '#dc3545';
          erroContainer.style.display = 'block';
          document.getElementById('statusErroMensagem').textContent = data.error || 'Falha ao buscar top produtos';
        }
      } catch (error) {
        estado.textContent = 'Erros encontrados';
        estado.style.color = '#dc3545';
        erroContainer.style.display = 'block';
        document.getElementById('statusErroMensagem').textContent = 'Erro de conexão com o servidor local. O server.js está rodando?';
      } finally {
        btnTop20Unidades.disabled = false;
        btnTop20Pesos.disabled = false;
      }
    }
  </script>
</body>
</html>
