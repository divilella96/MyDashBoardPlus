<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyzer Tech - Ferramentas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container"> 
    <h1>Ferramentas de Operações</h1>
    <div class="coluna">
      <h2>Extração de Dados Lyzer</h2>
      <div class="order-input-group" style="flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 20px;">
        <input type="email" id="lyzerEmail" placeholder="E-mail Lyzer" aria-label="E-mail Lyzer" class="order-input" />
        <input type="password" id="lyzerPassword" placeholder="Senha Lyzer" aria-label="Senha Lyzer" class="order-input" />
        <button class="btn-primary btn-add" id="btnCrawler" onclick="rodarCrawler()">Extrair Dados Lyzer</button>
      </div>
      <div id="statusCrawler" aria-live="polite" style="font-size: 0.9rem; margin-bottom: 10px; min-height: 20px;"></div>
      <pre id="resultadoCrawler" style="background: #f4f4f4; padding: 10px; border-radius: 4px; font-size: 0.8rem; overflow-x: auto; display: none;"></pre>

      <h2>Geral</h2>
      <div class="order-input-group">
        <input type="text" id="numeroEncomendaGeral" placeholder="Nº da Encomenda" aria-label="Número da Encomenda" aria-describedby="erroEncomendaGeral" class="order-input" />
        <button class="btn-primary btn-add" onclick="pesquisarEncomenda()">Pesquisar</button>
      </div>
      <div id="erroEncomendaGeral" class="visually-hidden" aria-live="polite" style="color: #dc3545; font-size: 0.9rem; margin-top: -5px; margin-bottom: 10px;"></div>

      <button class="btn-primary" onclick="window.open('aviso_atraso.html', '_blank')">Avisar cliente sobre atraso</button>
      <button class="btn-primary" onclick="window.open('comunicacao_bot.html', '_blank')">Comunicação Com Bot</button>
      <button class="btn-primary" onclick="window.open('mapa_emel.html', '_blank')">Validar Mapa EMEL</button>
      <button class="btn-primary" onclick="abrirMensagemWhatsApp()">Report Bloqueio POS</button>
      <button class="btn-primary" onclick="abrirPaginaContato()">E-mail Artigo Esquecido</button>

      <h2>Rato</h2>
      <button class="btn-primary" onclick="abrirLiveOperationsRato()">Rato - Em Direto</button>
      <button class="btn-primary" onclick="abrirRotaRato()">ROTA Rato</button>
      <h2>São Bento</h2>
      <button class="btn-primary" onclick="abrirLiveOperationsSaoBento()">São Bento - Em Direto</button>
      <button class="btn-primary" onclick="abrirRotaSaoBento()">ROTA São Bento</button>
    </div>
  </div>

  <script>
    function pesquisarEncomenda() {
      const input = document.getElementById('numeroEncomendaGeral');
      const erroElement = document.getElementById('erroEncomendaGeral');
      const searchText = input.value.trim();

      if (!searchText) {
        erroElement.textContent = 'Por favor, insira o número da encomenda.';
        erroElement.classList.remove('visually-hidden');
        input.setAttribute('aria-invalid', 'true');
        return;
      }

      erroElement.textContent = '';
      erroElement.classList.add('visually-hidden');
      input.setAttribute('aria-invalid', 'false');

      const url = new URL("https://perform.lyzer.tech/pt/app/retail/orders");
      url.searchParams.append("dateSearchFor", "deadline");
      url.searchParams.append("dateRange[from]", "2026-01-01T00:00:00.000Z");
      url.searchParams.append("dateRange[to]", new Date().toISOString());
      url.searchParams.append("searchText", searchText);
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      url.searchParams.append("sort", "deadline:desc");

      window.open(url.toString(), "_blank");
    }

    function abrirPaginaContato() {
      window.open("contact.html", "_blank");
    }

    function getStatusList() {
      return ["Pending","InAssignment","Open","Invoicing","Processing","Complete","InTransit","Incidence"];
    }

    function getFullStatusList() {
      return [...getStatusList(),"Cancelled","ManualAssignment"];
    }

    function abrirLiveOperationsSaoBento() {
      const agoraLocal = getLocalISOString(new Date());
      const agoraUTC = new Date().toISOString();
      const url = new URL("https://perform.lyzer.tech/pt/app/operations/live-operations");
      url.searchParams.append("dateRange[from]", agoraLocal);
      url.searchParams.append("stores", "244");

      const statuses = ["Cancelled", "Complete", "InAssignment", "Incidence", "InTransit", "Invoicing", "Open", "Pending", "Processing"];
      statuses.forEach(status => url.searchParams.append("status", status));

      url.searchParams.append("deadline", agoraUTC);
      url.searchParams.append("retailer", "29");
      url.searchParams.append("store", "244");
      url.searchParams.append("serviceType", "375");
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "50");

      window.open(url.toString(), "_blank");
    }

    function abrirLiveOperationsRato() {
      const agora = getLocalISOString(new Date());
      const url = new URL("https://perform.lyzer.tech/pt/app/operations/live-operations");
      url.searchParams.append("deliveryDeadline", agora);
      url.searchParams.append("retailer", "29");
      url.searchParams.append("store", "133");
      url.searchParams.append("serviceType", "190");
      getFullStatusList().forEach(status => url.searchParams.append("status", status));
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      window.open(url.toString(), "_blank");
    }

    function abrirMensagemWhatsApp() {
      window.open("mensagem.html", "_blank");
    }

    function getLocalISOString(date) {
      const offset = date.getTimezoneOffset();
      const dateWithOffset = new Date(date.getTime() - (offset * 60 * 1000));
      return dateWithOffset.toISOString().slice(0, -1);
    }

    function abrirRotaRato() {
      // Format current date as YYYY-MM-DDT00:00:00
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const dataAtual = `${yyyy}-${mm}-${dd}T00:00:00`;

      const url = new URL("https://perform.lyzer.tech/pt/app/operations/routes");
      url.searchParams.append("targetDate", dataAtual);
      url.searchParams.append("stores", "133");
      url.searchParams.append("storeServices", "190");
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      window.open(url.toString(), "_blank");
    }

    function abrirRotaSaoBento() {
      // Format current date as YYYY-MM-DDT00:00:00
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const dataAtual = `${yyyy}-${mm}-${dd}T00:00:00`;

      const url = new URL("https://perform.lyzer.tech/pt/app/operations/routes");
      url.searchParams.append("targetDate", dataAtual);
      url.searchParams.append("storeServices", "375");
      url.searchParams.append("pageIndex", "1");
      url.searchParams.append("pageSize", "20");
      window.open(url.toString(), "_blank");
    }

    async function rodarCrawler() {
      const email = document.getElementById('lyzerEmail').value.trim();
      const password = document.getElementById('lyzerPassword').value.trim();
      const statusEl = document.getElementById('statusCrawler');
      const resultadoEl = document.getElementById('resultadoCrawler');
      const btnCrawler = document.getElementById('btnCrawler');

      if (!email || !password) {
        statusEl.textContent = 'Por favor, preencha o e-mail e a senha.';
        statusEl.style.color = '#dc3545';
        return;
      }

      statusEl.textContent = 'Iniciando extração... (isso pode levar alguns segundos)';
      statusEl.style.color = '#007bff';
      resultadoEl.style.display = 'none';
      btnCrawler.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/crawler', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          statusEl.textContent = 'Extração concluída com sucesso!';
          statusEl.style.color = '#28a745';
          resultadoEl.textContent = JSON.stringify(data.data, null, 2);
          resultadoEl.style.display = 'block';
        } else {
          statusEl.textContent = 'Erro: ' + (data.error || 'Falha na extração');
          statusEl.style.color = '#dc3545';
        }
      } catch (error) {
        statusEl.textContent = 'Erro de conexão com o servidor local. O server.js está rodando?';
        statusEl.style.color = '#dc3545';
      } finally {
        btnCrawler.disabled = false;
      }
    }
  </script>
</body>
</html>
